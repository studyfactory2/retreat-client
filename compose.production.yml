name: retreat-client

services:
  frontend:
    image: retreat-client:${RELEASE_TAG:?Run bash deploy.sh prepare first}
    build:
      context: .
      args:
        VITE_FRONTEND_URL: ${VITE_FRONTEND_URL:?Set the public frontend HTTPS origin}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set the public API HTTPS URL ending in /api}
      labels:
        org.opencontainers.image.revision: ${GIT_COMMIT:?Run bash deploy.sh prepare first}
    environment:
      CLOUDFRONT_ORIGIN_SECRET: ${CLOUDFRONT_ORIGIN_SECRET:?Set the CloudFront origin verification secret}
    networks:
      - default
      - proxy
    restart: unless-stopped
    ports:
      - "${ORIGIN_BIND_IP:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
    name: retreat-proxy
