worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error messages can contain raw query strings. Use safe access logs below.
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;

    # Fit the 64-character origin secret on hosts with 64-byte cache lines.
    map_hash_bucket_size 128;

    # The entrypoint replaces only this placeholder with a validated runtime secret.
    map $http_x_retreat_origin_verify $origin_verified {
        default 0;
        "__RETREAT_ORIGIN_SECRET__" 1;
    }

    map "$status:$uri" $asset_cache {
        default "no-store";
        ~^200:/assets/ "public, max-age=31536000, immutable";
    }

    # Resolve replacement API containers without restarting the frontend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Container-local health check; never published to the host or CloudFront.
    server {
        listen 127.0.0.1:8082;
        access_log off;
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
        location / { return 404; }
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 12m;
        client_body_timeout 90s;

        if ($origin_verified = 0) { return 403; }

        add_header Cache-Control $asset_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location = /api { return 404; }

        location ^~ /api/ {
            set $api_upstream retreat-api:3100;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # CloudFront appends the actual viewer IP last. Do not append its edge IP.
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Retreat-Origin-Verify "";
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
            proxy_next_upstream off;
            proxy_redirect off;
            proxy_intercept_errors off;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
        }

        location /assets/ {
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }

        # BrowserRouter routes must reach the app on refresh and QR-link entry.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
