<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1755d1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>연결 확인 · ITCEN 휴양소</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px 20px; background: #f5f7fb; color: #132448; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: 100%; max-width: 440px; padding: 36px 28px; border: 1px solid #dce4f0; border-radius: 24px; background: #fff; }
      .brand { margin: 0 0 32px; color: #1755d1; font-size: 14px; font-weight: 700; }
      h1 { margin: 0 0 16px; font-size: clamp(24px, 6vw, 30px); line-height: 1.4; letter-spacing: -0.04em; word-break: keep-all; overflow-wrap: anywhere; }
      p { margin: 0 0 16px; color: #536178; font-size: 15px; line-height: 1.8; word-break: keep-all; overflow-wrap: anywhere; }
      button { width: 100%; min-height: 48px; margin-top: 8px; border: 0; border-radius: 12px; background: #1755d1; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #132448; outline-offset: 4px; }
      footer { margin-top: 28px; color: #536178; font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">ITCEN 휴양소</p>
      <h1>인터넷 연결을<br />확인해 주세요.</h1>
      <p>현재 페이지를 열 수 없어요. Wi-Fi 또는 모바일 데이터에 연결한 후 다시 시도해 주세요.</p>
      <p>체크리스트 제출과 사진 업로드는 인터넷 연결이 필요해요. 연결이 끊긴 동안 제출이 완료되었는지는 다시 접속한 후 확인해 주세요.</p>
      <button type="button" id="retry">다시 시도</button>
      <footer>ITCEN 휴양소</footer>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
